databaseChangeLog:
- changeSet:
    id:  1
    author:  "Florian MAZEN"
    changes:
      - sql:
          comment: Uppercase station names and replace characters outside [A-Z0-9_] with an underscore
          sql: UPDATE station SET main_qrz = regexp_replace(upper(main_qrz), '[^A-Z0-9_]', '_', 'g') WHERE main_qrz !~ '^[A-Z0-9_]+$'
      - sql:
          comment: Enforce the station name format
          sql: ALTER TABLE station ADD CONSTRAINT ck_station_main_qrz_format CHECK (main_qrz ~ '^[A-Z0-9_]+$')
