databaseChangeLog:
- changeSet:
    id:  1
    author:  "Florian MAZEN"
    changes:
      - createTable:
          tableName: station_grant
          columns:
            - column:
                name: id
                type: uuid
                defaultValueComputed: gen_random_uuid()
                constraints:
                  primaryKey: true
                  primaryKeyName: pk_station_grant
                  nullable: false
            - column:
                name: station_id
                type: uuid
                constraints:
                  nullable: false
            - column:
                name: subject
                type: varchar(100)
                constraints:
                  nullable: false
            - column:
                name: role
                type: varchar(10)
                constraints:
                  nullable: false
      - addUniqueConstraint:
          tableName: station_grant
          columnNames: station_id, subject
          constraintName: uq_station_grant_station_id_subject
      - addForeignKeyConstraint:
          baseTableName: station_grant
          baseColumnNames: station_id
          referencedTableName: station
          referencedColumnNames: id
          constraintName: fk_station_grant_station_id
          onDelete: CASCADE
